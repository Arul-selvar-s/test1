<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Elysian Dental Lounge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --cream:#F0F6FF;--warm:#E8F1FC;--sage-l:#BDD8F5;--sage-d:#183b56;
      --gold:#0b69ff;--dark:#0d1f2d;--mid:#2E5275;--light:#6B93B8;
      --border:#C5DDEF;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;
    }
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:#0d1f2d;color:#fff;min-height:100vh}

    /* ── LOGIN SCREEN ── */
    .login-screen{
      position:fixed;inset:0;background:#0d1f2d;
      display:flex;align-items:center;justify-content:center;
      z-index:1000;
    }
    .login-box{
      background:#fff;border-radius:24px;padding:3rem;
      width:100%;max-width:400px;text-align:center;
      box-shadow:0 24px 80px rgba(0,0,0,0.4);
    }
    .login-logo{
      font-family:'Cormorant Garamond',serif;
      font-size:22px;font-weight:400;color:#183b56;margin-bottom:0.25rem;
    }
    .login-logo span{font-style:italic;color:#0b69ff}
    .login-sub{font-size:12px;color:#6B93B8;margin-bottom:2rem;letter-spacing:0.05em}
    .login-box input{
      width:100%;border:1px solid #C5DDEF;border-radius:12px;
      padding:13px 16px;font-family:'DM Sans',sans-serif;font-size:14px;
      color:#0d1f2d;background:#F0F6FF;outline:none;margin-bottom:1rem;
      transition:border-color 0.2s;
    }
    .login-box input:focus{border-color:#183b56}
    .login-btn{
      width:100%;background:#183b56;color:#fff;border:none;
      border-radius:30px;padding:14px;font-family:'DM Sans',sans-serif;
      font-size:14px;font-weight:500;cursor:pointer;transition:all 0.2s;
    }
    .login-btn:hover{background:#0b69ff;transform:translateY(-1px)}
    .login-error{font-size:13px;color:#ef4444;margin-top:0.75rem;display:none}

    /* ── MAIN LAYOUT ── */
    .admin-wrap{display:none;min-height:100vh;flex-direction:column}

    /* TOP BAR */
    .topbar{
      background:rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.1);
      padding:0 2rem;height:64px;display:flex;align-items:center;
      justify-content:space-between;position:sticky;top:0;z-index:100;
      backdrop-filter:blur(12px);
    }
    .topbar-brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400}
    .topbar-brand span{font-style:italic;color:#BDD8F5}
    .topbar-right{display:flex;align-items:center;gap:1rem}
    .topbar-badge{
      font-size:11px;background:rgba(34,197,94,0.2);color:#86efac;
      padding:4px 12px;border-radius:20px;border:1px solid rgba(34,197,94,0.3);
    }
    .logout-btn{
      font-size:13px;color:rgba(255,255,255,0.5);background:none;
      border:none;cursor:pointer;transition:color 0.2s;
    }
    .logout-btn:hover{color:#fff}

    /* TABS */
    .tabs{
      display:flex;gap:0;background:rgba(255,255,255,0.04);
      border-bottom:1px solid rgba(255,255,255,0.1);padding:0 2rem;
    }
    .tab{
      padding:14px 20px;font-size:13px;color:rgba(255,255,255,0.5);
      cursor:pointer;border-bottom:2px solid transparent;
      transition:all 0.2s;background:none;border-top:none;
      border-left:none;border-right:none;
      font-family:'DM Sans',sans-serif;white-space:nowrap;
    }
    .tab:hover{color:rgba(255,255,255,0.85)}
    .tab.active{color:#fff;border-bottom-color:#0b69ff}

    /* CONTENT AREA */
    .content{flex:1;padding:2rem;max-width:1100px;margin:0 auto;width:100%}

    /* ── NEW POST FORM ── */
    .form-card{
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;padding:2rem;
    }
    .form-card h2{
      font-family:'Cormorant Garamond',serif;font-size:26px;
      font-weight:300;margin-bottom:1.75rem;
    }
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
    .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:1.25rem}
    .form-group label{
      font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
      color:rgba(255,255,255,0.45);
    }
    .form-group input,.form-group select,.form-group textarea{
      background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
      border-radius:12px;padding:12px 16px;font-family:'DM Sans',sans-serif;
      font-size:14px;color:#fff;outline:none;transition:border-color 0.2s;
      resize:vertical;
    }
    .form-group input::placeholder,.form-group textarea::placeholder{color:rgba(255,255,255,0.25)}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{
      border-color:rgba(11,105,255,0.6);background:rgba(255,255,255,0.1);
    }
    .form-group select option{background:#1a3a5c;color:#fff}
    .form-group textarea{min-height:320px;line-height:1.7}

    /* TOOLBAR for content */
    .editor-toolbar{
      display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      border-radius:12px 12px 0 0;padding:8px 12px;
    }
    .tb-btn{
      background:rgba(255,255,255,0.1);border:none;color:rgba(255,255,255,0.7);
      padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;
      transition:all 0.2s;font-family:'DM Sans',sans-serif;
    }
    .tb-btn:hover{background:rgba(11,105,255,0.4);color:#fff}
    #postContent{border-radius:0 0 12px 12px!important}

    /* IMAGE PREVIEW */
    .img-preview{
      margin-top:0.75rem;border-radius:12px;overflow:hidden;
      border:1px solid rgba(255,255,255,0.1);display:none;
    }
    .img-preview img{width:100%;max-height:200px;object-fit:cover;display:block}

    /* CHAR COUNTER */
    .char-count{font-size:11px;color:rgba(255,255,255,0.3);text-align:right;margin-top:4px}

    /* PUBLISH BTN */
    .publish-row{display:flex;gap:1rem;align-items:center;margin-top:1.5rem;flex-wrap:wrap}
    .btn-publish{
      background:#0b69ff;color:#fff;border:none;border-radius:30px;
      padding:14px 32px;font-family:'DM Sans',sans-serif;font-size:14px;
      font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;
      align-items:center;gap:8px;
    }
    .btn-publish:hover{background:#0050cc;transform:translateY(-2px)}
    .btn-publish:disabled{background:rgba(255,255,255,0.15);cursor:not-allowed;transform:none}
    .btn-draft{
      background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);
      border:1px solid rgba(255,255,255,0.15);border-radius:30px;
      padding:14px 24px;font-family:'DM Sans',sans-serif;font-size:14px;
      cursor:pointer;transition:all 0.2s;
    }
    .btn-draft:hover{background:rgba(255,255,255,0.12);color:#fff}
    .btn-preview{
      background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);
      border:1px solid rgba(255,255,255,0.15);border-radius:30px;
      padding:14px 24px;font-family:'DM Sans',sans-serif;font-size:14px;
      cursor:pointer;transition:all 0.2s;
    }
    .btn-preview:hover{background:rgba(255,255,255,0.12);color:#fff}

    /* STATUS TOAST */
    .toast{
      position:fixed;bottom:2rem;right:2rem;z-index:9999;
      padding:1rem 1.5rem;border-radius:14px;font-size:14px;
      display:flex;align-items:center;gap:10px;
      transform:translateY(100px);opacity:0;
      transition:all 0.35s ease;max-width:360px;
    }
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{background:#166534;border:1px solid #22c55e;color:#dcfce7}
    .toast.error{background:#7f1d1d;border:1px solid #ef4444;color:#fee2e2}
    .toast.loading{background:#1e3a5f;border:1px solid #3b82f6;color:#dbeafe}

    /* ── POSTS TABLE ── */
    .posts-header{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;
    }
    .posts-header h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:300}
    .posts-count{
      font-size:12px;background:rgba(255,255,255,0.08);
      color:rgba(255,255,255,0.5);padding:4px 12px;border-radius:20px;
    }
    .search-bar{
      background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);
      border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;
      font-size:13px;color:#fff;outline:none;width:240px;
    }
    .search-bar::placeholder{color:rgba(255,255,255,0.3)}
    .posts-table{width:100%;border-collapse:collapse}
    .posts-table th{
      text-align:left;font-size:11px;letter-spacing:0.1em;
      text-transform:uppercase;color:rgba(255,255,255,0.35);
      padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .posts-table td{
      padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.06);
      font-size:13px;vertical-align:middle;
    }
    .posts-table tr:last-child td{border-bottom:none}
    .posts-table tr:hover td{background:rgba(255,255,255,0.03)}
    .post-thumb-sm{
      width:52px;height:36px;border-radius:6px;object-fit:cover;
      border:1px solid rgba(255,255,255,0.1);
    }
    .post-title-td{color:#fff;font-weight:500;max-width:300px}
    .post-title-td small{display:block;font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;font-weight:400}
    .cat-pill-sm{
      font-size:10px;background:rgba(11,105,255,0.18);color:#93c5fd;
      padding:3px 10px;border-radius:20px;white-space:nowrap;
    }
    .status-live{color:#86efac;font-size:11px;display:flex;align-items:center;gap:5px}
    .status-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0}
    .status-draft{color:rgba(255,255,255,0.4);font-size:11px;display:flex;align-items:center;gap:5px}
    .status-draft::before{content:'';width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.3);flex-shrink:0}
    .action-btns{display:flex;gap:6px}
    .btn-edit{
      font-size:11px;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);
      border:1px solid rgba(255,255,255,0.12);border-radius:8px;
      padding:5px 12px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;
    }
    .btn-edit:hover{background:rgba(255,255,255,0.14);color:#fff}
    .btn-del{
      font-size:11px;background:rgba(239,68,68,0.12);color:#fca5a5;
      border:1px solid rgba(239,68,68,0.25);border-radius:8px;
      padding:5px 12px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;
    }
    .btn-del:hover{background:rgba(239,68,68,0.25);color:#fff}
    .btn-view{
      font-size:11px;background:rgba(11,105,255,0.12);color:#93c5fd;
      border:1px solid rgba(11,105,255,0.25);border-radius:8px;
      padding:5px 12px;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;
      text-decoration:none;display:inline-block;
    }
    .btn-view:hover{background:rgba(11,105,255,0.25);color:#fff}
    .empty-state{
      text-align:center;padding:4rem 2rem;color:rgba(255,255,255,0.3);
    }
    .empty-state p{font-size:14px;margin-top:0.5rem}

    /* ── SETTINGS ── */
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
    .settings-card{
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
      border-radius:16px;padding:1.75rem;
    }
    .settings-card h3{
      font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;
      margin-bottom:1.25rem;padding-bottom:0.75rem;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .settings-card .form-group{margin-bottom:1rem}
    .btn-save-settings{
      background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15);
      border-radius:10px;padding:10px 20px;font-family:'DM Sans',sans-serif;
      font-size:13px;cursor:pointer;transition:all 0.2s;margin-top:0.5rem;
    }
    .btn-save-settings:hover{background:rgba(11,105,255,0.4)}
    .token-input{font-family:monospace!important;font-size:12px!important;letter-spacing:0.05em}
    .token-note{font-size:11px;color:rgba(255,255,255,0.3);margin-top:6px;line-height:1.6}
    .section-info{
      background:rgba(11,105,255,0.1);border:1px solid rgba(11,105,255,0.2);
      border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.5rem;
    }
    .section-info p{font-size:13px;color:#93c5fd;line-height:1.7}
    .section-info strong{color:#fff}

    /* PROGRESS BAR */
    .progress-bar{
      height:3px;background:rgba(255,255,255,0.1);border-radius:2px;
      margin-top:1rem;overflow:hidden;display:none;
    }
    .progress-fill{
      height:100%;background:linear-gradient(to right,#0b69ff,#22c55e);
      border-radius:2px;transition:width 0.3s;width:0%;
    }

    /* PREVIEW MODAL */
    .preview-modal{
      position:fixed;inset:0;background:rgba(0,0,0,0.8);
      z-index:500;display:none;align-items:center;justify-content:center;
      padding:2rem;
    }
    .preview-modal.show{display:flex}
    .preview-inner{
      background:#F0F6FF;border-radius:20px;max-width:800px;
      width:100%;max-height:80vh;overflow-y:auto;
      color:#0d1f2d;
    }
    .preview-header{
      padding:1.25rem 1.5rem;border-bottom:1px solid #C5DDEF;
      display:flex;justify-content:space-between;align-items:center;
      position:sticky;top:0;background:#F0F6FF;border-radius:20px 20px 0 0;
    }
    .preview-header h3{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:#183b56}
    .close-preview{background:none;border:none;font-size:22px;cursor:pointer;color:#6B93B8}
    .preview-body{padding:2rem}
    .preview-body img{width:100%;border-radius:14px;margin-bottom:1.5rem;max-height:300px;object-fit:cover}
    .preview-body h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:#183b56;margin-bottom:0.5rem}
    .preview-body .meta{font-size:12px;color:#6B93B8;margin-bottom:1.5rem}
    .preview-body .content-text{font-size:15px;color:#2E5275;line-height:1.85;white-space:pre-wrap}

    @media(max-width:700px){
      .form-row{grid-template-columns:1fr}
      .settings-grid{grid-template-columns:1fr}
      .content{padding:1rem}
      .tabs{padding:0 1rem;overflow-x:auto}
      .tab{padding:12px 14px}
    }

    /* ── IMAGE UPLOAD UI ── */
    .img-tabs{display:flex;gap:0;margin-bottom:0;border-radius:10px 10px 0 0;overflow:hidden;border:1px solid rgba(255,255,255,0.12);border-bottom:none}
    .img-tab{flex:1;padding:9px 14px;font-size:12px;font-family:'DM Sans',sans-serif;font-weight:500;cursor:pointer;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);border:none;transition:all 0.2s}
    .img-tab.active{background:rgba(255,255,255,0.13);color:#fff}
    .img-tab-body{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:0 0 10px 10px;padding:0.75rem}
    .upload-dropzone{border:2px dashed rgba(255,255,255,0.18);border-radius:10px;padding:1.5rem 1rem;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(255,255,255,0.04)}
    .upload-dropzone:hover,.upload-dropzone.drag-over{border-color:#0b69ff;background:rgba(11,105,255,0.08)}
    .upload-icon{font-size:28px;margin-bottom:6px}
    .upload-text{font-size:13px;color:rgba(255,255,255,0.7);line-height:1.6}
    .upload-text span{font-size:11px;color:rgba(255,255,255,0.35)}
    .upload-hint{font-size:11px;color:rgba(255,255,255,0.3);margin-top:4px}
    .upload-progress{margin-top:0.75rem;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;position:relative;height:28px}
    .upload-progress-bar{height:100%;background:linear-gradient(to right,#0b69ff,#22c55e);transition:width 0.3s;width:0%}
    .upload-progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
    .upload-error{margin-top:0.5rem;font-size:12px;color:#fca5a5;background:rgba(239,68,68,0.12);border-radius:8px;padding:8px 12px;border:1px solid rgba(239,68,68,0.2)}
    .upload-success{margin-top:0.5rem;font-size:12px;color:#86efac;background:rgba(34,197,94,0.1);border-radius:8px;padding:8px 12px;border:1px solid rgba(34,197,94,0.2)}
    .img-preview{margin-top:0.75rem;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);position:relative}
    .img-preview img{width:100%;max-height:200px;object-fit:cover;display:block}
    .img-remove-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#fff;border:none;border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;transition:all 0.2s}
    .img-remove-btn:hover{background:rgba(239,68,68,0.8)}
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">Elysian <span>Dental</span> Lounge</div>
    <div class="login-sub">ADMIN DASHBOARD</div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="off"/>
    <input type="password" id="loginPass" placeholder="Password" autocomplete="off"/>
    <button class="login-btn" onclick="doLogin()">Sign In →</button>
    <div class="login-error" id="loginError">Wrong username or password.</div>
  </div>
</div>

<!-- ── MAIN ADMIN ── -->
<div class="admin-wrap" id="adminWrap">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-brand">Elysian <span>Dental</span> Lounge — Admin</div>
    <div class="topbar-right">
      <span class="topbar-badge" id="postCountBadge">0 Posts</span>
      <a href="elysian_dental_lounge_v2.html" target="_blank" style="font-size:13px;color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.2s" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.5)'">View Site ↗</a>
      <button class="logout-btn" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('new',this)">✏️ New Post</button>
    <button class="tab" onclick="switchTab('posts',this)">📋 All Posts</button>
    <button class="tab" onclick="switchTab('settings',this)">⚙️ Settings</button>
  </div>

  <!-- ══ TAB: NEW POST ══ -->
  <div class="content" id="tab-new">
    <div class="form-card">
      <h2>Create New Blog Post</h2>

      <div class="form-row">
        <div class="form-group">
          <label>Post Title *</label>
          <input type="text" id="postTitle" placeholder="e.g. Why Regular Dental Checkups Matter" oninput="updateCharCount('postTitle','titleCount',100)"/>
          <div class="char-count"><span id="titleCount">0</span>/100</div>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select id="postCategory">
            <option value="">— Select category —</option>
            <option value="Oral Health">Oral Health</option>
            <option value="Cosmetic Dentistry">Cosmetic Dentistry</option>
            <option value="Orthodontics">Orthodontics</option>
            <option value="Dental Implants">Dental Implants</option>
            <option value="Kids Dentistry">Kids Dentistry</option>
            <option value="Daily Tips">Daily Tips</option>
            <option value="Patient Stories">Patient Stories</option>
            <option value="Clinic News">Clinic News</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Short Excerpt * (shown on blog listing page)</label>
        <input type="text" id="postExcerpt" placeholder="One or two sentences summarising this post..." oninput="updateCharCount('postExcerpt','excerptCount',180)"/>
        <div class="char-count"><span id="excerptCount">0</span>/180</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Cover Image *</label>

          <!-- TABS -->
          <div class="img-tabs">
            <button class="img-tab active" onclick="switchImgTab('upload',this)" type="butt
