# Settings for the blog editor (Sveltia CMS). Most people never need to open this file.
# If you move to a new website address you do NOT need to change anything here:
# the editor talks to the GitHub repository, not to the website address.

backend:
  name: github
  repo: Arul-selvar-s/test1
  branch: main
  base_url: https://api.sveltia.com
  auth_endpoint: auth

# Where uploaded photos are saved in the repository
media_folder: /images/blog
public_folder: /images/blog

media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:      # big photos are shrunk and saved as WebP so pages stay fast
          format: webp
          quality: 82
          width: 1600
          height: 1600

# Web addresses made from titles: plain letters, numbers and hyphens
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog articles
    label_singular: Blog article
    description: Write, edit, schedule or hide the articles shown on the Blog page and the homepage.
    folder: /content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - label: Article title
        name: title
        widget: string
        required: true
        pattern: ['^.{5,100}$', 'The title must be between 5 and 100 characters.']
        hint: 'Clear and specific, for example: Why Regular Dental Checkups Matter (up to 100 characters).'

      - label: Publish date
        name: date
        widget: datetime
        type: date
        required: true
        hint: 'The day the article appears on the website. Pick a future day to schedule it: it goes live by itself early that morning.'

      - label: Category
        name: category
        widget: select
        required: true
        options:
          - Oral Health
          - Cosmetic Dentistry
          - Orthodontics
          - Dental Implants
          - Kids Dentistry
          - Daily Tips
          - Patient Stories
          - Clinic News
        hint: 'Decides which button on the Blog page this article appears under.'

      - label: Related treatment(s)
        name: services
        widget: select
        multiple: true
        required: false
        options:
          - { label: Prosthodontics, value: prosthodontics }
          - { label: Dental Implants, value: implants }
          - { label: Orthodontics, value: orthodontics }
          - { label: Smile Designing, value: smile }
          - { label: Clearalign, value: clearalign }
          - { label: Root Canal Treatment, value: rootcanal }
          - { label: Sedation Dentistry, value: sedation }
          - { label: Paediatric Dentistry, value: paediatric }
        hint: 'Optional. If the article is about one of our treatments, choose it: the article then also appears on that treatment page, newest first.'

      - label: Short excerpt
        name: excerpt
        widget: text
        required: true
        pattern: ['^[\s\S]{20,180}$', 'Write between 20 and 180 characters: one or two sentences.']
        hint: 'One or two sentences shown on the blog list and in Google results (up to 180 characters).'

      - label: Cover photo
        name: image
        widget: image
        required: true
        hint: 'The main photo for the article. Use a photo you own or have permission to use. Wide (landscape) photos look best.'

      - label: Photo description
        name: image_alt
        widget: string
        required: false
        hint: 'A few words describing the photo, for people who cannot see it (for example: Dentist showing a patient an X-ray). Leave empty to use the title.'

      - label: Author
        name: author
        widget: string
        default: Dr. Yokesh Kumar R
        required: true

      - label: Show on website
        name: published
        widget: boolean
        default: false
        hint: 'Switch ON when the article is ready for patients to read. OFF keeps it hidden (a draft).'

      - label: Article text
        name: body
        widget: markdown
        required: true
        hint: 'Use the toolbar for headings, bold text, bullet lists and links. Do not write patient names or medical details about real patients.'

  - name: gallery
    label: Smile Gallery
    label_singular: Smile transformation
    description: Upload before and after photos to the Smile Gallery page. Each entry needs a Before photo, an After photo, a treatment category and a title.
    folder: /content/gallery
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}} — {{category}}'
    sortable_fields: ['order', 'title', 'category']
    view_groups:
      - label: By treatment
        field: category
    fields:
      - label: Case title
        name: title
        widget: string
        required: true
        hint: 'A short label for this transformation, e.g. "Full Smile Makeover with Veneers". Visible to patients on the gallery page.'

      - label: Treatment category
        name: category
        widget: select
        required: true
        options:
          - { label: Smile Designing,  value: smile-designing }
          - { label: Dental Implants,  value: dental-implants }
          - { label: Orthodontics,     value: orthodontics }
          - { label: Teeth Whitening,  value: teeth-whitening }
          - { label: Root Canal,       value: root-canal }
          - { label: Prosthodontics,   value: prosthodontics }
          - { label: Paediatric,       value: paediatric }
          - { label: Clearalign,       value: clearalign }
        hint: 'Decides which filter button this case appears under on the gallery page.'

      - label: Before photo
        name: before_image
        widget: image
        required: true
        media_folder: /images/gallery
        public_folder: /images/gallery
        hint: 'The photo taken before treatment. Use a clear, well-lit photo. Patient consent must be obtained before uploading.'

      - label: After photo
        name: after_image
        widget: image
        required: true
        media_folder: /images/gallery
        public_folder: /images/gallery
        hint: 'The photo taken after treatment, from the same angle as the Before photo.'

      - label: Short description
        name: description
        widget: text
        required: false
        hint: 'Optional. One or two sentences shown below the photos, e.g. "Complete smile makeover using ceramic veneers. Completed in 2 visits."'

      - label: Display order
        name: order
        widget: number
        default: 999
        value_type: int
        min: 1
        hint: 'Controls the order cards appear on the page. 1 appears first, 999 appears last. Use whole numbers like 1, 2, 3…'

      - label: Show on website
        name: draft
        widget: boolean
        default: true
        hint: 'When ON (default), this case is hidden — use this while you are preparing it. Switch OFF to make it visible to patients on the gallery page.'
